name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android platform scaffolding
        working-directory: mobile_app
        run: flutter create . --platforms=android --org com.nestle.nmc

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: mobile_app
        run: flutter test

      - name: Build Debug APK
        working-directory: mobile_app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestle-medical-congress-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Create Release and attach APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.0-apk
          name: "Nestlé Medical Congress APK (v1.0.0)"
          body: "Pre-built Android APK for the Nestlé Medical Congress 2026 mobile app."
          files: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
