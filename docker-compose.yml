services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nmc
      POSTGRES_PASSWORD: nmc
      POSTGRES_DB: nmc
    ports:
      - "5432:5432"
    volumes:
      - nmc-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nmc-minio:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb -p local/nmc || true;
      "

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://nmc:nmc@postgres:5432/nmc
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: nmc
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_REGION: me-central-1
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: congress@example.com
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio-init

  worker:
    build: ./backend
    command: arq app.workers.main.WorkerSettings
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://nmc:nmc@postgres:5432/nmc
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: congress@example.com
    depends_on:
      - postgres
      - redis

volumes:
  nmc-postgres:
  nmc-minio:
