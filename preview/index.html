<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nestlé Medical Congress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #071A4A; --navy2: #0B2C78; --gold: #F5B942; --blue: #2F6BFF; --cyan: #4FC3F7;
      --muted: #6B7A99; --ink: #0B1B45; --line: #E3E8F4; --soft: #F3F6FC; --danger: #E5484D; --ok: #22A06B;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; background: #040e2c; color: white; }
    .stage { max-width: 430px; margin: 0 auto; min-height: 100vh; background: linear-gradient(180deg, var(--navy), var(--navy2)); padding: 28px 20px 96px; }
    h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.05; }
    .gold { color: var(--gold); }
    .muted { color: #A9B8DC; font-size: 13px; line-height: 1.4; }
    .pill { display: inline-block; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: 6px 12px; font-size: 10px; font-weight: 700; letter-spacing: .8px; }
    .center { text-align: center; }
    .rule { width: 48px; height: 2px; background: var(--gold); margin: 10px auto; }
    .card { background: white; color: var(--ink); border-radius: 28px; padding: 20px; box-shadow: 0 8px 24px rgba(7,26,74,.18); }
    .row { display: flex; gap: 12px; align-items: center; }
    .shield { width: 44px; height: 44px; border-radius: 14px; background: var(--blue); color: white; display: grid; place-items: center; flex: none; }
    label.field { display: block; margin-top: 12px; }
    input[type="email"], input[type="password"], input[type="text"], input[type="search"] {
      width: 100%; border: 1px solid var(--line); background: var(--soft); border-radius: 14px; padding: 14px 14px 14px 40px; font: inherit; color: var(--ink);
    }
    .field { position: relative; }
    .field .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; display: grid; place-items: center; pointer-events: none; }
    .field .ico svg { display: block; }
    .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
    .btn { margin-top: 16px; width: 100%; border: 0; border-radius: 14px; padding: 15px; color: white; font-weight: 700; cursor: pointer; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .err { color: var(--danger); font-size: 12px; margin-top: 8px; }
    .ok { color: var(--ok); font-size: 12px; margin-top: 8px; }
    .linkish { background: none; border: 0; color: var(--blue); font-weight: 700; cursor: pointer; padding: 0; font: inherit; }
    .goldlink { color: var(--gold); font-weight: 800; cursor: pointer; background: none; border: 0; font: inherit; }
    .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
    .chip { background: rgba(255,255,255,.08); border-radius: 16px; padding: 12px 8px; text-align: center; font-size: 11px; line-height: 1.25; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink); margin: 12px 0; }
    .rules { font-size: 12px; color: var(--muted); margin: 8px 0; }
    .rules div.pass { color: var(--ok); }
    .back { width: 40px; height: 40px; border-radius: 14px; border: 0; background: rgba(255,255,255,.08); color: white; font-size: 20px; cursor: pointer; }
    .otp { display: flex; gap: 8px; }
    .otp input { width: 0; flex: 1 1 0; min-width: 0; text-align: center; padding: 14px 0; font-size: 20px; font-weight: 700; border: 1px solid var(--line); background: var(--soft); border-radius: 14px; color: var(--ink); }
    .search { display: flex; align-items: center; background: white; border-radius: 18px; padding-right: 6px; }
    .search input { border: 0; background: transparent; }
    .go { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--cyan); color: white; cursor: pointer; }
    .feature { margin-top: 16px; border-radius: 20px; padding: 16px; background: linear-gradient(90deg, #1D4ED8, #38BDF8); display: flex; gap: 12px; cursor: pointer; }
    .overline { font-size: 10px; letter-spacing: .8px; font-weight: 700; color: var(--gold); }
    .head { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .tile { background: none; border: 0; color: white; cursor: pointer; font: inherit; }
    .tile i, .ico-box { width: 52px; height: 52px; margin: 0 auto 6px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(180deg, var(--blue), var(--cyan)); }
    .tile span { display: block; font-size: 11px; }
    .ask-fab { position: fixed; right: max(18px, calc(50% - 197px)); bottom: 78px; z-index: 6; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 16px; background: var(--gold); color: #1a1404; font-weight: 800; cursor: pointer; box-shadow: 0 8px 18px rgba(0,0,0,.25); }
    .ask-fab svg { width: 18px; height: 18px; flex: none; }
    .bubble { border-radius: 16px; padding: 12px 14px; margin-top: 10px; line-height: 1.4; }
    .bubble.user { margin-left: 48px; background: #2F6BFF; color: white; }
    .bubble.bot { margin-right: 28px; background: white; color: var(--ink); }
    .chat-bar { display: flex; gap: 8px; margin-top: 12px; }
    .chat-bar input { flex: 1; border: 0; border-radius: 14px; padding: 12px 14px; }
    .session { background: white; color: var(--ink); border-radius: 16px; padding: 12px; display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .time { width: 56px; text-align: center; font-weight: 800; font-size: 13px; }
    .time small { display: block; color: var(--muted); font-weight: 500; }
    .panel { background: white; color: var(--ink); border-radius: 16px; padding: 18px; text-align: center; }
    .bell { position: relative; width: 40px; height: 40px; border-radius: 14px; border: 0; background: rgba(255,255,255,.08); color: white; cursor: pointer; }
    .dot { position: absolute; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; top: 8px; right: 8px; }
    nav.bottom { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(430px, 100%); display: grid; grid-template-columns: 1fr 1fr; background: #071433; border-top: 1px solid rgba(255,255,255,.08); }
    nav.bottom button { background: none; border: 0; color: #A9B8DC; padding: 14px; font: inherit; cursor: pointer; }
    nav.bottom button.on { color: var(--gold); font-weight: 700; }
    .days, .chips-row { display: flex; gap: 8px; overflow: auto; margin: 12px 0; }
    .day, .mini { border: 0; cursor: pointer; font: inherit; }
    .day { border-radius: 16px; padding: 10px 14px; background: rgba(255,255,255,.1); color: white; }
    .day.on { background: var(--gold); color: #1a1404; font-weight: 800; }
    .mini { border-radius: 999px; padding: 7px 12px; background: var(--soft); color: var(--ink); white-space: nowrap; flex: none; }
    .card .chips-row .mini { padding: 6px 11px; font-size: 13px; }
    .mini.on { background: var(--blue); color: white; }
    .strike { text-decoration: line-through; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--blue); background: #e8f0ff; border-radius: 999px; padding: 2px 8px; }
    .stage.tight { padding: 10px 16px 18px; }
    .reg-hero { text-align: center; margin-top: 6px; }
    .reg-hero .kicker { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .reg-hero h1 { margin: 0; font-size: 34px; line-height: 0.98; letter-spacing: -0.6px; }
    .reg-sub { text-align: center; color: #C5D0EA; font-size: 13.5px; line-height: 1.4; margin: 10px 6px 12px; }
    .card.reg { border-radius: 28px; padding: 16px 14px 14px; }
    .card.reg label.field { margin-top: 10px; }
    .card.reg label.field:first-child { margin-top: 0; }
    .card.reg .field input { width: 100%; border: 1px solid #E6EBF5; border-radius: 18px; background: #F4F7FB; height: 50px; padding-left: 44px; outline: none; }
    .card.reg .field input::placeholder { color: #8B98B4; }
    .card.reg .field input:focus { border-color: #C5D0E8; }
    .card.reg .check input { width: 16px; height: 16px; margin: 2px 0 0; flex: none; accent-color: #2F6BFF; }
    .card.reg .btn { border-radius: 18px; height: 50px; margin-top: 4px; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 1; }
    .or-cap { text-align: center; color: #98A4C0; font-size: 11px; letter-spacing: 1.2px; font-weight: 600; margin: 14px 0 10px; }
    .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .socials button { height: 48px; border-radius: 16px; border: 1px solid #E3E8F4; background: #fff; cursor: pointer; display: grid; place-items: center; }
    .card.reg .check { margin: 12px 2px 8px; align-items: flex-start; }
    .card.reg .check input { width: 16px; height: 16px; margin-top: 2px; flex: none; }
    .card.reg .check span { font-size: 12.5px; color: #6B7A99; line-height: 1.35; }
    .acct-foot { text-align: center; margin: 14px 0 4px; color: #C5D0EA; font-size: 14px; }
    .appbar { display: flex; align-items: center; gap: 8px; }
    .appbar strong { flex: 1; text-align: center; font-size: 18px; }
    .hero-card { display: flex; gap: 12px; align-items: center; margin-top: 16px; background: rgba(255,255,255,.08); border-radius: 22px; padding: 16px; }
    .hero-ico { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(180deg, var(--blue), var(--cyan)); flex: none; }
    .speaker { display: flex; gap: 12px; align-items: center; background: white; border: 1px solid #E6EBF5; border-radius: 18px; padding: 12px; margin-top: 10px; width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit; }
    .speaker.featured { border-color: #F5D48A; background: #FFFBF3; }
    .avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--blue); background: #EAF1FF; flex: none; border: 2px solid #D5E2FF; }
    .speaker.featured .avatar { border-color: var(--gold); color: #1a1404; background: #fff; }
    .pill-session { display: inline-block; margin-top: 6px; background: #E8F1FF; color: var(--blue); border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; }
    .badge-card { background: white; color: var(--ink); border-radius: 24px; overflow: hidden; margin-top: 16px; box-shadow: 0 8px 24px rgba(7,26,74,.18); }
    .badge-head { background: linear-gradient(90deg, #2F6BFF, #4FC3F7); color: white; text-align: center; padding: 18px 16px 28px; }
    .badge-head small { display: block; letter-spacing: 1.4px; font-size: 11px; font-weight: 700; opacity: .9; }
    .badge-head strong { display: block; letter-spacing: 1px; font-size: 16px; margin-top: 2px; }
    .badge-body { margin-top: -22px; padding: 0 16px 18px; text-align: center; }
    .badge-avatar { width: 80px; height: 80px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--gold); display: grid; place-items: center; background: white; color: var(--blue); font-size: 26px; font-weight: 800; }
    .info-row { display: flex; gap: 10px; align-items: center; text-align: left; background: #F4F7FB; border-radius: 16px; padding: 10px 12px; margin-top: 8px; }
    .info-ico { width: 36px; height: 36px; border-radius: 12px; background: white; color: var(--blue); display: grid; place-items: center; flex: none; }
    .qr-wrap { margin: 16px auto 6px; width: 160px; height: 160px; background: white; }
    .qr-wrap svg { display: block; }
    .qr-wrap.blur { filter: blur(6px); }
    .medal { display: inline-block; width: 16px; height: 16px; margin-left: 4px; vertical-align: -2px; }
    .map-card { position: relative; height: 190px; border-radius: 22px; overflow: hidden; margin-top: 12px; background: #dbe7f5; cursor: pointer; }
    .map-chip { position: absolute; top: 12px; left: 12px; background: white; color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
    .map-pin { position: absolute; left: 50%; top: 46%; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; box-shadow: 0 8px 16px rgba(7,26,74,.18); }
    .facilities { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .facility { display: flex; gap: 8px; align-items: center; background: #F4F7FB; border-radius: 14px; padding: 12px; font-weight: 700; }
    .dots { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
    .dots i { width: 6px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.35); display: block; }
    .dots i.on { width: 18px; background: #2F6BFF; }
    .opt { width: 100%; text-align: left; border: 1px solid #E6EBF5; background: white; border-radius: 16px; padding: 10px 12px; margin-top: 8px; cursor: pointer; font: inherit; color: inherit; }
    .opt.on { border-color: #2F6BFF; background: #F4F8FF; }
    .opt .bar { height: 6px; border-radius: 99px; background: #E6EBF5; margin-top: 6px; overflow: hidden; }
    .opt .bar span { display: block; height: 100%; background: linear-gradient(90deg, #2F6BFF, #4FC3F7); }
    .poll-nav { display: grid; grid-template-columns: 44px 1fr 44px; gap: 10px; align-items: center; margin-top: 14px; }
    .poll-nav .arrow { height: 44px; border: 0; border-radius: 14px; background: white; color: var(--blue); font-size: 18px; cursor: pointer; }
    .status-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 8px; font-size: 11px; font-weight: 800; }
    .q-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .q-tabs button { border: 0; border-radius: 999px; padding: 8px 0; background: rgba(255,255,255,.14); color: white; font: inherit; font-weight: 700; cursor: pointer; }
    .q-tabs button.on { background: var(--gold); color: #1a1404; }
    .q-card { display: flex; gap: 10px; background: #fffdf6; border: 1px solid #F5D48A; border-radius: 18px; padding: 12px; margin-top: 10px; text-align: left; color: var(--ink); }
    .q-card strong { color: var(--ink); }
    .res { display: flex; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid #EEF2F8; color: var(--ink); }
    .res-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
    .res-main { flex: 1; min-width: 0; }
    .res-main strong, .res-main .muted { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .finder { display: flex; align-items: center; gap: 8px; background: #F4F7FB; border-radius: 16px; padding: 12px 14px; }
    .finder input { border: 0; background: transparent; width: 100%; font: inherit; color: var(--ink); outline: none; }
    .avatar-ring { width: 88px; height: 88px; margin: 12px auto 0; border-radius: 50%; padding: 4px; background: #F5B942; position: relative; }
    .avatar-face { width: 100%; height: 100%; border-radius: 50%; background: white; color: var(--blue); display: grid; place-items: center; font-size: 28px; font-weight: 800; overflow: hidden; }
    .avatar-face img { width: 100%; height: 100%; object-fit: cover; }
    .pencil { position: absolute; right: -2px; bottom: 2px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: #F5B942; color: #1a1404; font-weight: 800; cursor: pointer; }
    .id-chip { display: inline-flex; margin-top: 10px; border: 1px solid #F5B942; color: #F5B942; border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .stat { background: white; color: var(--ink); border: 0; border-radius: 18px; padding: 14px 6px; cursor: pointer; }
    .stat strong { display: block; color: var(--blue); font-size: 22px; }
    .info-row { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 0; border-top: 1px solid #EEF2F8; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; color: inherit; font: inherit; cursor: pointer; }
    .info-ico { width: 36px; height: 36px; border-radius: 12px; background: #E8F0FF; color: var(--blue); display: grid; place-items: center; flex: none; }
    .profile-fields label { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 700; }
    .profile-fields > input { width: 100%; box-sizing: border-box; border: 1px solid #E6EBF5; border-radius: 14px; background: #F4F7FB; padding: 12px 14px; font: inherit; color: var(--ink); }
    .chips-row { scrollbar-width: none; }
    .chips-row::-webkit-scrollbar { display: none; }
    .q-vote { width: 42px; border: 0; background: transparent; color: var(--blue); font-weight: 800; cursor: pointer; }
    .q-vote.on { color: var(--blue); }
    textarea.ask { width: 100%; min-height: 84px; border: 0; background: #F4F7FB; border-radius: 16px; padding: 12px 14px; font: inherit; resize: none; color: var(--ink); }
    .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; align-items: end; }
    .sheet .box { background: white; color: var(--ink); border-radius: 28px 28px 0 0; padding: 20px 20px 32px; max-width: 430px; margin: 0 auto; width: 100%; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="stage" id="app"></div>
  <nav class="bottom hidden" id="nav">
    <button id="nav-home" class="on">Home</button>
    <button id="nav-profile">Profile</button>
  </nav>
  <script>
    const state = { screen: "welcome", busy: false, error: "", info: "", devOtp: "", email: "", user: null, event: null, unread: 0, upcoming: null, search: "", results: null, obscure: true, terms: false, password: "", sheet: null };
    const tokenKey = "nmc_tokens";

    function tokens() { try { return JSON.parse(localStorage.getItem(tokenKey) || "null"); } catch { return null; } }
    function saveTokens(data) { localStorage.setItem(tokenKey, JSON.stringify({ access: data.access_token, refresh: data.refresh_token, user: data.user })); state.user = data.user; }
    function clearTokens() { localStorage.removeItem(tokenKey); state.user = null; }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      const saved = tokens();
      if (saved?.access && !options.authless) headers.Authorization = "Bearer " + saved.access;
      let res = await fetch("/api/v1" + path, { ...options, headers });
      let body = await res.json().catch(() => ({}));
      if (res.status === 401 && body.error?.code === "TOKEN_EXPIRED" && saved?.refresh && !options.retried) {
        const refresh = await fetch("/api/v1/auth/refresh", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: saved.refresh }) });
        const refreshed = await refresh.json();
        if (!refresh.ok) { clearTokens(); throw Object.assign(new Error("Session expired"), { body: refreshed }); }
        saveTokens(refreshed.data);
        return api(path, { ...options, retried: true });
      }
      if (!res.ok) {
        const error = new Error(body.error?.message || "Something went wrong.");
        error.body = body;
        throw error;
      }
      return body.data;
    }

    function fieldError(name) {
      const fields = state.errorFields || [];
      return fields.find((item) => item.field === name)?.message || "";
    }

    function render() {
      const app = document.getElementById("app");
      app.classList.toggle("tight", state.screen === "register");
      const nav = document.getElementById("nav");
      nav.classList.toggle("hidden", state.screen !== "home" && state.screen !== "profile");
      document.getElementById("nav-home").classList.toggle("on", state.screen === "home");
      document.getElementById("nav-profile").classList.toggle("on", state.screen === "profile");
      app.innerHTML = screens[state.screen]();
      if (state.sheet) app.insertAdjacentHTML("beforeend", state.sheet);
      bind();
    }

    const screens = {
      welcome() {
        return `<div class="center"><span class="pill">NESTLÉ MEDICAL CONGRESS</span></div>
          <div style="height:16px"></div>
          <h1 class="center">NESTLÉ</h1><h1 class="center gold">CONGRESS</h1><div class="rule"></div>
          <p class="muted center">The Next Era of Nutrition & Health</p>
          <div class="card">
            <div class="row"><div style="flex:1"><strong style="font-size:18px">Welcome Back</strong><div class="muted" style="color:var(--muted)">Sign in to continue your congress experience</div></div><div class="shield">🛡</div></div>
            <label class="field"><span class="ico">✉</span><input id="email" type="email" placeholder="Enter your email" value="${esc(state.email)}"></label>
            <label class="field"><span class="ico">🔒</span><input id="password" type="${state.obscure ? "password" : "text"}" placeholder="Enter your password" value="${esc(state.loginPassword || "")}"><button class="eye" id="eye" type="button">${state.obscure ? "Show" : "Hide"}</button></label>
            ${state.error ? `<div class="err">${esc(state.error)}</div>` : ""}
            <button class="btn" id="signin" ${state.busy ? "disabled" : ""}>${state.busy ? "Signing in…" : "Sign In →"}</button>
            <div class="center" style="margin-top:8px"><button class="linkish" id="forgot">🔒 Forgot password?</button></div>
          </div>
          <p class="center muted" style="margin-top:18px">Don't have an account? <button class="goldlink" id="create">Create Account →</button></p>
          <div class="chips"><div class="chip">🌐<br>Global<br>Experts</div><div class="chip">📘<br>Knowledge<br>Sessions</div><div class="chip">🤝<br>Networking &<br>Opportunities</div></div>`;
      },
      register() {
        const eye = state.obscure
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B98B4" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.4"/></svg>`

      },
      profile() {

        const face = user.avatar_url ? `<img src="${esc(user.avatar_url)}" alt="">` : esc(initials);
        return `<div class="appbar"><button class="back" id="back">‹</button><strong>My Profile</strong><button class="back" id="settings" aria-label="Settings">⚙</button></div>

    function qrSvg(modules) {
      if (!modules || !modules.length) return "";

      return `<svg viewBox="0 0 ${size} ${size}" width="160" height="160" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="white"/><g fill="#111">${cells.join("")}</g></svg>`;

      const choice = state.pollChoices?.[poll.id];

    function connectPolls() {
      if (state.pollSocket) return;
      const saved = tokens();
      if (!saved?.access) return;
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      let socket;
      try { socket = new WebSocket(`${protocol}://${location.host}/api/v1/ws?token=${encodeURIComponent(saved.access)}`); }
      catch { return; }
      state.pollSocket = socket;
      socket.onopen = () => socket.send(JSON.stringify({ type: "subscribe", topics: ["polls"] }));
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data || "{}");
        if (message.type === "poll.results_updated" && state.screen === "voting") loadPolls(true);
        if ((message.type === "question.published" || message.type === "question.answered") && state.screen === "qna") loadQuestions(null, false, true);
        if (message.type === "ping") socket.send(JSON.stringify({ type: "pong" }));
      };
      socket.onclose = () => { state.pollSocket = null; };

    async function submitVote() {
      const poll = (state.polls || [])[state.pollIndex || 0];
      const optionId = state.pollChoices?.[poll?.id];
      if (!poll || !optionId) return shiftPoll(1);
      state.busy = true;
      state.error = "";
      state.info = "";
      render();
      try {
        const data = await api(`/polls/${poll.id}/votes`, {
          method: "POST",
          headers: { "Idempotency-Key": crypto.randomUUID() },
          body: JSON.stringify({ option_ids: [optionId] }),
        });
        state.polls[state.pollIndex] = data.poll;
        delete state.pollChoices[poll.id];
        state.info = "Vote submitted";
      } catch (error) {
        const code = error.body?.error?.code;
        if (code === "ALREADY_VOTED" || code === "POLL_CLOSED" || code === "POLL_NOT_ACTIVE") await loadPolls(true);
        state.error = error.message;

    function followLink(link) {
      if (!link) return go("home");
      const match = String(link).match(/^nmc:\/\/([^/]+)\/?([^/]*)/);
      const kind = match ? match[1] : "";
      const id = match ? match[2] : "";
      if (kind === "session") return id ? openSession(id) : loadAgenda();
      if (kind === "poll") return loadPolls();
      if (kind === "question") return loadQuestions();
      if (kind === "qna") return loadQuestions();
      if (kind === "resource") return loadResources();
      if (kind === "exhibitor") return id ? openExhibitor(id) : loadExhibitors();
      return go("home");
    }
    async function loadNotifications() {
      state.screen = "notifications";
      state.error = "";
      render();
      try {
        const data = await api("/notifications");
        state.notifications = data.notifications || [];
        state.unread = data.unread_count || 0;
      } catch (error) {
        state.error = error.message;
      }
      if (state.screen === "notifications") render();
    }
    async function search() {
      try { state.results = await api("/search?q=" + encodeURIComponent(state.search)); }
      catch (error) { state.results = { sessions: [] }; state.error = error.message; }
      render();
    }

    async function logout() {
      const saved = tokens();
      try { await api("/auth/logout", { method: "POST", body: JSON.stringify({ refresh_token: saved?.refresh }) }); } catch {}
      clearTokens(); go("welcome");
    }

    document.getElementById("nav-home").onclick = () => { go("home"); loadHome(); };
    document.getElementById("nav-profile").onclick = () => loadProfile();
    (async function boot() {
      const saved = tokens();
      if (saved?.refresh) {
        try {
          const data = await api("/auth/refresh", { method: "POST", authless: true, body: JSON.stringify({ refresh_token: saved.refresh }) });
          saveTokens(data); go("home"); await loadHome(); return;
        } catch { clearTokens(); }
      }
      render();
    })();
  </script>
</body>
</html>
